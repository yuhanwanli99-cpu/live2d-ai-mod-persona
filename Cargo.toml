[package]
name = "live2d-ai-mod-persona"
description = "Live2D-Ai 酒馆角色卡 Mod（rc.4 M5）：导入 SillyTavern V1/V2 JSON 或内嵌 chara 的 PNG，合成 system_prompt 经一等 apply_settings 写回主链"
version = "0.3.1"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
authors = ["Sakura Motion Project"]

[dependencies]
live2d-ai-mod-system = { path = "../Live2D-Ai/crates/live2d-ai-mod-system" }
serde_json = "1"
# PNG 内嵌卡（tEXt/iTXt 的 chara 负载）是 base64；workspace 已有 base64 0.22，
# 提为直接依赖不新增 crate（见 SOURCES.md 登记）。
base64 = "0.22"
log = "0.4"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[workspace]
